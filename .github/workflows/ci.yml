name: Verify plugin
on: [push, pull_request, workflow_dispatch]
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-STG-Learning
          path: '*.tgz'
